name: CI/CD (qualidade, SAST e DAST)

on:
  push:
    branches: [main, master]
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci-cd.yml']
  pull_request:
    paths: ['backend/**', 'frontend/**', '.github/workflows/ci-cd.yml']
  schedule:
    # Varredura semanal: novas consultas do CodeQL pegam falhas em código que não mudou.
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    name: Lint, typecheck and coverage
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run coverage
      # Falha o build se alguma dependência de produção tiver vulnerabilidade alta ou crítica.
      - run: npm audit --omit=dev --audit-level=high
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-coverage
          path: backend/coverage
          if-no-files-found: ignore

  frontend:
    name: Frontend typecheck and audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm audit --omit=dev --audit-level=high

  codeql:
    name: CodeQL SAST
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          # Conjunto ampliado de consultas de segurança (além do padrão).
          queries: security-extended
      - uses: github/codeql-action/analyze@v3

  wapiti-staging:
    name: Wapiti DAST on staging
    if: github.event_name == 'workflow_dispatch' && vars.STAGING_URL != ''
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check wapiti3
      - name: Scan configured staging URL
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}
        run: |
          BASE="${STAGING_URL%/}"
          wapiti -u "$BASE/" \
            -s "$BASE/health" \
            -s "$BASE/api/auth/login" \
            -s "$BASE/api/auth/forgot-password" \
            -s "$BASE/api/auth/reset-password" \
            --scope domain --flush-session -f html -o wapiti-report
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wapiti-dast-report
          path: wapiti-report/
          if-no-files-found: ignore