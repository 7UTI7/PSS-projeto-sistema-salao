# /etc/logrotate.d/sistema-salao — produção (VPS Ubuntu, ver backend/DEPLOYMENT.md).
# A API roda como o usuário de serviço nodeapp, com LOG_FILE=/var/log/sistema-salao/api.log.
/var/log/sistema-salao/api.log {
    daily
    rotate 30
    compress
    delaycompress
    missingok
    notifempty
    create 0640 nodeapp nodeapp
    su nodeapp nodeapp
    postrotate
        # A API trata SIGHUP reabrindo o arquivo de log (src/config/logger.ts).
        systemctl kill -s HUP nodeapp.service >/dev/null 2>&1 || true
    endscript
}
