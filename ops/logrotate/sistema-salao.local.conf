# Rotação de logs da homologação local (executada por ops/local/mongo.sh rotate ou via cron).
# __RUNTIME__ é substituído pelo caminho absoluto de ops/local/.runtime.

# Log do MongoDB: o logrotate renomeia e o SIGUSR1 faz o mongod reabrir mongod.log
# (systemLog.logRotate: reopen no mongod.conf).
__RUNTIME__/logs/mongod.log {
    daily
    rotate 14
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    create 0600
    postrotate
        [ -f __RUNTIME__/mongod.pid ] && kill -USR1 "$(cat __RUNTIME__/mongod.pid)" || true
    endscript
}

# Log da API (Pino, JSON). Localmente o processo roda via tsx watch, então usa copytruncate:
# copia o conteúdo e zera o arquivo sem precisar sinalizar o processo.
__RUNTIME__/logs/api.log {
    daily
    rotate 14
    maxsize 10M
    compress
    delaycompress
    missingok
    notifempty
    copytruncate
}
